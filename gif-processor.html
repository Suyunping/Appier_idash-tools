<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF 批次處理工具</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/gifuct-js@2.1.2/dist/gifuct-js.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--s1:#141414;--s2:#1c1c1c;--s3:#242424;
  --border:#252525;--border2:#333;
  --text:#f0f0f0;--muted:#5a5a5a;--muted2:#888;
  --green:#a8f04a;--blue:#5eb8ff;--amber:#ffb830;--red:#ff5c5c;--purple:#c084fc;
  --mono:'DM Mono',monospace;--sans:'Syne',sans-serif;--r:6px;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;font-size:14px}

.topbar{
  position:sticky;top:0;z-index:200;
  background:rgba(13,13,13,0.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:0.6rem 1.5rem;
  display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;
}
.topbar h1{font-size:1rem;font-weight:700;color:var(--green);letter-spacing:-0.01em;white-space:nowrap}
.topbar .sub{font-family:var(--mono);font-size:0.62rem;color:var(--muted)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.sg{display:flex;align-items:center;gap:0.5rem}
.sg label{font-family:var(--mono);font-size:0.65rem;color:var(--muted);white-space:nowrap}
.sg input[type=number]{
  background:var(--s2);border:1px solid var(--border2);border-radius:var(--r);
  color:var(--text);font-family:var(--mono);font-size:0.72rem;
  padding:0.28rem 0.5rem;outline:none;width:68px;
}
.sg input:focus{border-color:var(--green)}
.sg span{font-family:var(--mono);font-size:0.65rem;color:var(--muted)}

.main{max-width:1100px;margin:0 auto;padding:1.25rem 1.5rem 5rem}

#drop-zone{
  border:1.5px dashed var(--border2);border-radius:10px;
  padding:2.5rem 1rem;text-align:center;cursor:pointer;
  transition:all 0.15s;margin-bottom:1.25rem;
}
#drop-zone:hover,#drop-zone.over{border-color:var(--green);background:rgba(168,240,74,0.03)}
#drop-zone .icon{font-size:2rem;opacity:0.3;margin-bottom:0.6rem}
#drop-zone .t{font-size:0.88rem;font-weight:600;margin-bottom:0.3rem}
#drop-zone .s{font-size:0.72rem;color:var(--muted);font-family:var(--mono)}

/* Summary cards */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:0.6rem;margin-bottom:1.25rem}
.sc{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:0.7rem 1rem}
.sc-n{font-size:1.5rem;font-weight:700;line-height:1;margin-bottom:0.2rem}
.sc-l{font-family:var(--mono);font-size:0.6rem;color:var(--muted)}
.c-ok{color:var(--green)}.c-comp{color:var(--amber)}.c-done{color:var(--blue)}.c-err{color:var(--red)}

/* Table */
.table-wrap{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.tbar{
  display:flex;align-items:center;gap:0.6rem;padding:0.65rem 1rem;
  border-bottom:1px solid var(--border);background:var(--s2);flex-wrap:wrap;
}
.tbar-title{font-family:var(--mono);font-size:0.68rem;color:var(--muted2);margin-right:auto}
.tbtn{
  background:none;border:1px solid var(--border2);border-radius:var(--r);
  color:var(--muted);font-family:var(--mono);font-size:0.62rem;
  padding:0.25rem 0.55rem;cursor:pointer;transition:all 0.12s;white-space:nowrap;
}
.tbtn:hover{color:var(--text);border-color:var(--text)}

/* columns: check | thumb | name | dims | origKB | action-type | output | action */
.col-hd,.row{
  display:grid;
  grid-template-columns:20px 52px minmax(0,2fr) 96px 72px 130px 130px 76px;
  gap:0.5rem;align-items:center;
  padding:0.55rem 1rem;
  border-bottom:1px solid var(--border);
}
.col-hd{
  background:var(--s3);border-bottom:1px solid var(--border2);
  padding:0.38rem 1rem;
}
.col-hd span{font-family:var(--mono);font-size:0.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em}
.row:last-child{border-bottom:none}
.row:hover{background:var(--s2)}
.row.hidden{display:none!important}

.row input[type=checkbox]{accent-color:var(--green);width:13px;height:13px;cursor:pointer}
.thumb{width:48px;height:36px;object-fit:contain;border-radius:4px;background:var(--s3);display:block}
.rname{font-family:var(--mono);font-size:0.68rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted2)}
.rdim{font-family:var(--mono);font-size:0.68rem;color:var(--muted2)}
.rkb{font-family:var(--mono);font-size:0.68rem;color:var(--muted2)}

.badge{
  display:inline-flex;align-items:center;gap:3px;
  font-family:var(--mono);font-size:0.6rem;font-weight:500;
  padding:0.22rem 0.5rem;border-radius:4px;white-space:nowrap;
}
.b-loop{background:rgba(168,240,74,0.1);color:var(--green)}
.b-comp{background:rgba(255,184,48,0.1);color:var(--amber)}

.out-cell{font-family:var(--mono);font-size:0.62rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.out-kb{color:var(--muted2)}.out-kb.ok{color:var(--green)}.out-kb.warn{color:var(--red)}
.out-dims{color:var(--muted)}

.act-btn{
  background:none;border:1px solid var(--border2);border-radius:var(--r);
  color:var(--muted2);font-family:var(--mono);font-size:0.6rem;
  padding:0.28rem 0.5rem;cursor:pointer;transition:all 0.12s;white-space:nowrap;width:100%;
}
.act-btn:hover:not(:disabled){border-color:var(--green);color:var(--green)}
.act-btn.done{border-color:var(--green);color:var(--green);background:rgba(168,240,74,0.08)}
.act-btn.err{border-color:var(--red);color:var(--red)}
.act-btn:disabled{opacity:0.35;cursor:not-allowed}

.empty{padding:3.5rem;text-align:center;color:var(--muted);font-family:var(--mono);font-size:0.75rem}

/* Bottom bar */
.bbar{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(13,13,13,0.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding:0.7rem 1.5rem;
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
}
.sel-info{font-family:var(--mono);font-size:0.72rem;color:var(--muted);min-width:80px}
.b-main{
  background:var(--green);color:#0a0a0a;border:none;border-radius:var(--r);
  font-family:var(--sans);font-size:0.82rem;font-weight:700;
  padding:0.5rem 1.1rem;cursor:pointer;transition:opacity 0.12s;
}
.b-main:hover{opacity:0.88}
.b-main:disabled{opacity:0.3;cursor:not-allowed}
.b-sec{
  background:none;border:1px solid var(--border2);border-radius:var(--r);
  color:var(--muted2);font-family:var(--mono);font-size:0.72rem;
  padding:0.5rem 0.9rem;cursor:pointer;transition:all 0.12s;
}
.b-sec:hover{border-color:var(--text);color:var(--text)}
.prog-wrap{flex:1;min-width:140px;display:none}
.prog-track{background:var(--s3);border-radius:3px;height:4px;overflow:hidden}
.prog-bar{height:100%;background:var(--green);width:0;transition:width 0.2s}
.prog-label{font-family:var(--mono);font-size:0.62rem;color:var(--muted);margin-top:0.3rem}

/* Processing note */
.proc-note{
  background:rgba(94,184,255,0.05);border:1px solid rgba(94,184,255,0.2);
  border-radius:var(--r);padding:0.6rem 1rem;margin-bottom:1rem;
  font-family:var(--mono);font-size:0.68rem;color:var(--blue);
}

@media(max-width:800px){
  .col-hd,.row{grid-template-columns:20px 44px 1fr 80px 60px 110px 100px 64px}
  .summary{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>GIF 批次處理</h1>
  <span class="sub">Loop × 5 · 壓縮 &lt; 目標大小</span>
  <div class="topbar-right">
    <div class="sg">
      <label>Loop 次數</label>
      <input type="number" id="loop-count" value="5" min="0" max="65535">
      <span>次</span>
    </div>
    <div class="sg">
      <label>大小上限</label>
      <input type="number" id="max-kb" value="300" min="10" max="5000">
      <span>KB</span>
    </div>
  </div>
</div>

<div class="main">
  <div id="drop-zone" ondragover="onDragOver(event)" ondragleave="onDragLeave()" ondrop="onDrop(event)" onclick="document.getElementById('fi').click()">
    <div class="icon">🎞</div>
    <div class="t">點擊或拖曳 GIF 到這裡</div>
    <div class="s">可一次上傳多張 · 僅接受 .gif 格式</div>
    <input type="file" id="fi" multiple accept=".gif,image/gif" style="display:none" onchange="addFiles(this.files)">
  </div>

  <div class="proc-note">
    ℹ 小於大小上限的 GIF：只修改 Loop 次數，不重新編碼，檔案品質不變。超過的：縮小尺寸重新編碼並修改 Loop。<strong>檔名完全不變。</strong>
  </div>

  <div class="summary">
    <div class="sc c-ok"><div class="sc-n" id="n-loop">0</div><div class="sc-l">🔁 只改 Loop</div></div>
    <div class="sc c-comp"><div class="sc-n" id="n-comp">0</div><div class="sc-l">📦 需壓縮</div></div>
    <div class="sc c-done"><div class="sc-n" id="n-done">0</div><div class="sc-l">✅ 已完成</div></div>
    <div class="sc c-err"><div class="sc-n" id="n-err">0</div><div class="sc-l">❌ 失敗</div></div>
  </div>

  <div class="table-wrap">
    <div class="tbar">
      <span class="tbar-title" id="tbar-count">尚未上傳 GIF</span>
      <button class="tbtn" onclick="selectAll()">全選</button>
      <button class="tbtn" onclick="clearAll()" style="color:var(--red)">清除全部</button>
    </div>
    <div class="col-hd">
      <span></span><span></span>
      <span>檔名</span>
      <span>尺寸</span>
      <span>原始大小</span>
      <span>處理方式</span>
      <span>輸出結果</span>
      <span>動作</span>
    </div>
    <div id="rows"><div class="empty">上傳 GIF 後顯示分析結果</div></div>
  </div>
</div>

<div class="bbar">
  <span class="sel-info" id="sel-info">已選 0 張</span>
  <button class="b-main" id="batch-btn" onclick="processBatch()" disabled>批量處理並下載 ZIP</button>
  <button class="b-sec" onclick="clearDone()">清除已完成</button>
  <div class="prog-wrap" id="prog-wrap">
    <div class="prog-track"><div class="prog-bar" id="prog-bar"></div></div>
    <div class="prog-label" id="prog-label"></div>
  </div>
</div>

<script>
// ── Constants ──────────────────────────────────────────
const WORKER_SCRIPT = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';

// ── State ──────────────────────────────────────────────
let items = [], nextId = 0;

// ── Helpers ────────────────────────────────────────────
function getMaxKB() { return parseFloat(document.getElementById('max-kb').value) || 300; }
function getLoopCount() { return parseInt(document.getElementById('loop-count').value) || 5; }
function fmtKB(kb) {
  if (kb >= 1024) return (kb/1024).toFixed(2) + ' MB';
  return kb.toFixed(0) + ' KB';
}

// ── GIF Binary: patch Netscape loop count ──────────────
function patchLoopCount(buffer, count) {
  const data = new Uint8Array(buffer.slice(0));
  const sig = [0x4E,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2E,0x30]; // NETSCAPE2.0
  for (let i = 0; i < data.length - 19; i++) {
    if (data[i] === 0x21 && data[i+1] === 0xFF && data[i+2] === 0x0B) {
      const match = sig.every((b, j) => data[i+3+j] === b);
      if (match && data[i+14] === 0x03 && data[i+15] === 0x01) {
        data[i+16] = count & 0xFF;
        data[i+17] = (count >> 8) & 0xFF;
        return data.buffer;
      }
    }
  }
  // No Netscape block → insert one after header + LSD + GCT
  return insertNetscapeBlock(data, count);
}

function insertNetscapeBlock(data, count) {
  // GIF89a header = 6 bytes, LSD = 7 bytes (total 13)
  // Byte at index 10 = packed field: bit7=GCT flag, bits0-2=GCT size
  const packed = data[10];
  const hasGCT = (packed >> 7) & 1;
  const gctSize = hasGCT ? 3 * (1 << ((packed & 0x07) + 1)) : 0;
  const insertAt = 13 + gctSize;

  const netscape = new Uint8Array([
    0x21, 0xFF, 0x0B,                                   // App Extension header
    0x4E,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2E,0x30, // NETSCAPE2.0
    0x03, 0x01,                                          // sub-block: size=3, id=1
    count & 0xFF, (count >> 8) & 0xFF,                  // loop count (little-endian)
    0x00                                                 // terminator
  ]);

  const result = new Uint8Array(data.length + netscape.length);
  result.set(data.slice(0, insertAt));
  result.set(netscape, insertAt);
  result.set(data.slice(insertAt), insertAt + netscape.length);
  return result.buffer;
}

// ── GIF Info: get dims from binary (fast, no full parse) ──
function getGifDims(buffer) {
  const d = new Uint8Array(buffer);
  // Logical Screen Descriptor: bytes 6-12
  // Width: bytes 6-7 (little-endian), Height: bytes 8-9 (little-endian)
  const w = d[6] | (d[7] << 8);
  const h = d[8] | (d[9] << 8);
  return { w, h };
}

// ── Drag & Drop ────────────────────────────────────────
function onDragOver(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('over'); }
function onDragLeave() { document.getElementById('drop-zone').classList.remove('over'); }
function onDrop(e) { e.preventDefault(); document.getElementById('drop-zone').classList.remove('over'); addFiles(e.dataTransfer.files); }

// ── Add files ──────────────────────────────────────────
function addFiles(fileList) {
  const arr = Array.from(fileList).filter(f => f.type === 'image/gif' || f.name.toLowerCase().endsWith('.gif'));
  if (!arr.length) return;
  arr.forEach(f => {
    const id = nextId++;
    const url = URL.createObjectURL(f);
    const maxKB = getMaxKB();
    const kb = f.size / 1024;
    const dims = getGifDims(); // will get async below
    const needsCompress = kb > maxKB;
    items.push({
      id, file: f, name: f.name, kb,
      w: 0, h: 0, thumbUrl: url,
      needsCompress,
      processState: 'idle',
      blob: null, outKB: null, outW: null, outH: null,
      checked: true,
    });
    // Get dims via image load
    const img = new Image();
    img.onload = () => {
      const it = items.find(i => i.id === id);
      if (it) { it.w = img.naturalWidth; it.h = img.naturalHeight; render(); }
    };
    img.src = url;
  });
  document.getElementById('fi').value = '';
  render();
}

// Re-check compress need when maxKB changes
document.getElementById('max-kb').addEventListener('change', () => {
  const maxKB = getMaxKB();
  items.forEach(it => { it.needsCompress = it.kb > maxKB; });
  render();
});

// ── Render ─────────────────────────────────────────────
function render() {
  updateSummary();
  renderRows();
  updateBatchBar();
}

function updateSummary() {
  document.getElementById('n-loop').textContent  = items.filter(i => !i.needsCompress).length;
  document.getElementById('n-comp').textContent  = items.filter(i =>  i.needsCompress).length;
  document.getElementById('n-done').textContent  = items.filter(i => i.processState === 'done').length;
  document.getElementById('n-err').textContent   = items.filter(i => i.processState === 'error').length;
  document.getElementById('tbar-count').textContent = items.length ? `共 ${items.length} 個 GIF` : '尚未上傳 GIF';
}

function renderRows() {
  const c = document.getElementById('rows');
  if (!items.length) { c.innerHTML = '<div class="empty">上傳 GIF 後顯示分析結果</div>'; return; }
  c.innerHTML = items.map(buildRow).join('');
}

function buildRow(it) {
  const maxKB = getMaxKB();
  const badge = it.needsCompress
    ? `<span class="badge b-comp">📦 壓縮 + Loop</span>`
    : `<span class="badge b-loop">🔁 只改 Loop</span>`;

  const kbStr = fmtKB(it.kb);
  const dimStr = it.w ? `${it.w}×${it.h}` : '—';

  let outHtml = '<span style="font-family:var(--mono);font-size:0.62rem;color:var(--muted)">—</span>';
  if (it.processState === 'done' && it.outKB != null) {
    const cls = it.outKB <= maxKB ? 'ok' : 'warn';
    const icon = it.outKB <= maxKB ? '✓' : '⚠';
    outHtml = `<div class="out-cell"><span class="out-kb ${cls}">${icon} ${fmtKB(it.outKB)}</span><span class="out-dims">${it.outW}×${it.outH}</span></div>`;
  } else if (it.processState === 'processing') {
    outHtml = `<span style="font-family:var(--mono);font-size:0.62rem;color:var(--amber)">處理中…</span>`;
  }

  let actHtml;
  if (it.processState === 'done') {
    actHtml = `<button class="act-btn done" onclick="downloadOne(${it.id})">↓ 下載</button>`;
  } else if (it.processState === 'processing') {
    actHtml = `<button class="act-btn" disabled>處理中…</button>`;
  } else if (it.processState === 'error') {
    actHtml = `<button class="act-btn err" onclick="processOne(${it.id})">重試</button>`;
  } else {
    actHtml = `<button class="act-btn" onclick="processOne(${it.id})">處理</button>`;
  }

  return `<div class="row" id="row-${it.id}">
    <div><input type="checkbox" ${it.checked?'checked':''} onchange="setCheck(${it.id},this.checked)"></div>
    <div><img class="thumb" src="${it.thumbUrl}" alt=""></div>
    <div class="rname" title="${it.name}">${it.name}</div>
    <div class="rdim">${dimStr}</div>
    <div class="rkb">${kbStr}</div>
    <div>${badge}</div>
    <div id="out-${it.id}">${outHtml}</div>
    <div id="act-${it.id}">${actHtml}</div>
  </div>`;
}

function updateRowCells(it) {
  const maxKB = getMaxKB();
  // Action cell
  const actEl = document.getElementById('act-' + it.id);
  if (actEl) {
    if (it.processState === 'done')
      actEl.innerHTML = `<button class="act-btn done" onclick="downloadOne(${it.id})">↓ 下載</button>`;
    else if (it.processState === 'processing')
      actEl.innerHTML = `<button class="act-btn" disabled>處理中…</button>`;
    else if (it.processState === 'error')
      actEl.innerHTML = `<button class="act-btn err" onclick="processOne(${it.id})">重試</button>`;
    else
      actEl.innerHTML = `<button class="act-btn" onclick="processOne(${it.id})">處理</button>`;
  }
  // Output cell
  const outEl = document.getElementById('out-' + it.id);
  if (outEl) {
    if (it.processState === 'done' && it.outKB != null) {
      const cls = it.outKB <= maxKB ? 'ok' : 'warn';
      const icon = it.outKB <= maxKB ? '✓' : '⚠';
      outEl.innerHTML = `<div class="out-cell"><span class="out-kb ${cls}">${icon} ${fmtKB(it.outKB)}</span><span class="out-dims">${it.outW}×${it.outH}</span></div>`;
    } else if (it.processState === 'processing') {
      outEl.innerHTML = `<span style="font-family:var(--mono);font-size:0.62rem;color:var(--amber)">處理中…</span>`;
    } else {
      outEl.innerHTML = `<span style="font-family:var(--mono);font-size:0.62rem;color:var(--muted)">—</span>`;
    }
  }
  updateSummary();
}

// ── Selection ──────────────────────────────────────────
function setCheck(id, val) { const it = items.find(i => i.id===id); if(it){ it.checked=val; updateBatchBar(); } }
function selectAll() { items.forEach(i => i.checked = true); renderRows(); updateBatchBar(); }
function updateBatchBar() {
  const sel = items.filter(i => i.checked);
  document.getElementById('sel-info').textContent = `已選 ${sel.length} 張`;
  document.getElementById('batch-btn').disabled = sel.length === 0;
}
function clearAll() { items.forEach(i => URL.revokeObjectURL(i.thumbUrl)); items = []; render(); }
function clearDone() { items = items.filter(i => i.processState !== 'done'); render(); }

// ── Core: process one GIF ──────────────────────────────
async function processGifItem(it) {
  const maxKB = getMaxKB();
  const loopCount = getLoopCount();
  const buffer = await it.file.arrayBuffer();

  // Case 1: already small enough → only patch loop count in binary
  if (!it.needsCompress) {
    const patched = patchLoopCount(buffer, loopCount);
    const blob = new Blob([patched], { type: 'image/gif' });
    return { blob, outW: it.w, outH: it.h, outKB: blob.size / 1024 };
  }

  // Case 2: needs compression → decode frames, rescale, re-encode
  let parsed, frames;
  try {
    parsed = gifuct.parseGIF(buffer);
    frames = gifuct.decompressFrames(parsed, true);
  } catch(e) {
    throw new Error('GIF 解析失敗：' + e.message);
  }
  if (!frames || frames.length === 0) throw new Error('無法讀取 GIF 幀');

  const origW = parsed.lsd.width;
  const origH = parsed.lsd.height;

  // Estimate scale needed (area-proportional to file size, with safety margin)
  let scale = Math.sqrt(maxKB / it.kb) * 0.88;
  scale = Math.max(0.15, Math.min(0.98, scale));
  let targetW = Math.max(4, Math.round(origW * scale));
  let targetH = Math.max(4, Math.round(origH * scale));

  const result = await encodeGif(frames, origW, origH, targetW, targetH, loopCount);
  let blob = result.blob;
  let outKB = blob.size / 1024;

  // If still too big, try smaller (one more pass)
  if (outKB > maxKB * 1.05) {
    const scale2 = Math.sqrt(maxKB / outKB) * 0.88;
    const w2 = Math.max(4, Math.round(targetW * scale2));
    const h2 = Math.max(4, Math.round(targetH * scale2));
    if (w2 < targetW) {
      const r2 = await encodeGif(frames, origW, origH, w2, h2, loopCount);
      blob = r2.blob; outKB = blob.size / 1024;
      targetW = w2; targetH = h2;
    }
  }

  return { blob, outW: targetW, outH: targetH, outKB };
}

// ── Encode frames with gif.js ──────────────────────────
function encodeGif(frames, origW, origH, targetW, targetH, loopCount) {
  return new Promise((resolve, reject) => {
    // Composite canvas: builds full frame by overlaying patches
    const compCanvas = document.createElement('canvas');
    compCanvas.width = origW; compCanvas.height = origH;
    const compCtx = compCanvas.getContext('2d');
    compCtx.clearRect(0, 0, origW, origH);

    // Temp canvas: for converting patch → image (respects alpha)
    const tmpCanvas = document.createElement('canvas');
    const tmpCtx = tmpCanvas.getContext('2d');

    // Output canvas: scaled version
    const outCanvas = document.createElement('canvas');
    outCanvas.width = targetW; outCanvas.height = targetH;
    const outCtx = outCanvas.getContext('2d');

    const gif = new GIF({
      workers: 2,
      quality: 10,
      width: targetW,
      height: targetH,
      workerScript: WORKER_SCRIPT,
      repeat: 0, // will binary-patch to loopCount after
    });

    let prevDisposal = 0;
    let prevDims = { left:0, top:0, width:origW, height:origH };

    for (const frame of frames) {
      // Handle disposal of previous frame
      if (prevDisposal === 2) {
        compCtx.clearRect(prevDims.left, prevDims.top, prevDims.width, prevDims.height);
      }

      // Draw patch via temp canvas (preserves alpha compositing)
      tmpCanvas.width  = frame.dims.width;
      tmpCanvas.height = frame.dims.height;
      const imgData = new ImageData(
        new Uint8ClampedArray(frame.patch),
        frame.dims.width,
        frame.dims.height
      );
      tmpCtx.clearRect(0, 0, frame.dims.width, frame.dims.height);
      tmpCtx.putImageData(imgData, 0, 0);
      compCtx.drawImage(tmpCanvas, frame.dims.left, frame.dims.top);

      // Scale to output canvas
      outCtx.clearRect(0, 0, targetW, targetH);
      outCtx.drawImage(compCanvas, 0, 0, targetW, targetH);

      gif.addFrame(outCanvas, { delay: frame.delay || 100, copy: true });

      prevDisposal = frame.disposalType || 0;
      prevDims = frame.dims;
    }

    gif.on('finished', async (blob) => {
      // Patch loop count in output binary
      const buf = await blob.arrayBuffer();
      const patched = patchLoopCount(buf, loopCount);
      resolve({ blob: new Blob([patched], { type: 'image/gif' }) });
    });
    gif.on('error', reject);
    gif.render();
  });
}

// ── Process / Download ─────────────────────────────────
async function processOne(id) {
  const it = items.find(i => i.id === id);
  if (!it) return;
  it.processState = 'processing';
  updateRowCells(it);
  try {
    const result = await processGifItem(it);
    it.blob = result.blob;
    it.outKB = result.outKB;
    it.outW = result.outW;
    it.outH = result.outH;
    it.processState = 'done';
  } catch (e) {
    console.error(e);
    it.processState = 'error';
  }
  updateRowCells(it);
  updateBatchBar();
}

function downloadOne(id) {
  const it = items.find(i => i.id === id);
  if (!it || !it.blob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(it.blob);
  a.download = it.name; // original filename
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

async function processBatch() {
  const sel = items.filter(i => i.checked && i.processState !== 'done');
  if (!sel.length) return;
  const btn = document.getElementById('batch-btn'); btn.disabled = true;
  const pw = document.getElementById('prog-wrap'); pw.style.display = 'block';
  const pb = document.getElementById('prog-bar');
  const pl = document.getElementById('prog-label');
  const zip = new JSZip();

  for (let i = 0; i < sel.length; i++) {
    const it = sel[i];
    pb.style.width = Math.round(i / sel.length * 100) + '%';
    pl.textContent = `${i+1} / ${sel.length} — ${it.name}`;
    it.processState = 'processing'; updateRowCells(it);
    try {
      const result = await processGifItem(it);
      it.blob = result.blob; it.outKB = result.outKB; it.outW = result.outW; it.outH = result.outH;
      it.processState = 'done';
      zip.file(it.name, result.blob); // original filename in ZIP
    } catch(e) {
      console.error(e);
      it.processState = 'error';
    }
    updateRowCells(it);
    await new Promise(r => setTimeout(r, 30));
  }

  pb.style.width = '100%';
  pl.textContent = '打包中…';
  const content = await zip.generateAsync({ type: 'blob' });
  saveAs(content, `gif_processed_${new Date().toISOString().slice(0,10)}.zip`);
  const doneCount = sel.filter(i => i.processState === 'done').length;
  pl.textContent = `完成！${doneCount} 個 GIF 已下載`;
  btn.disabled = false;
  updateBatchBar();
}
</script>
