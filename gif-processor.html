<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon-blue.svg">
<link rel="apple-touch-icon" href="favicon-blue.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF 批次處理工具</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--s1:#141414;--s2:#1c1c1c;--s3:#242424;
  --border:#252525;--border2:#333;
  --text:#f0f0f0;--muted:#5a5a5a;--muted2:#888;
  --green:#a8f04a;--blue:#5eb8ff;--amber:#ffb830;--red:#ff5c5c;
  --mono:'DM Mono',monospace;--sans:'Syne',sans-serif;--r:6px;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;font-size:14px}
.topbar{
  position:sticky;top:0;z-index:200;
  background:rgba(13,13,13,0.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:0.6rem 1.5rem;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;
}
.topbar h1{font-size:1rem;font-weight:700;color:var(--green);letter-spacing:-0.01em;white-space:nowrap}
.topbar .sub{font-family:var(--mono);font-size:0.62rem;color:var(--muted)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.sg{display:flex;align-items:center;gap:0.5rem}
.sg label{font-family:var(--mono);font-size:0.65rem;color:var(--muted);white-space:nowrap}
.sg input[type=number]{
  background:var(--s2);border:1px solid var(--border2);border-radius:var(--r);
  color:var(--text);font-family:var(--mono);font-size:0.72rem;
  padding:0.28rem 0.5rem;outline:none;width:68px;
}
.sg input:focus{border-color:var(--green)}
.sg span{font-family:var(--mono);font-size:0.65rem;color:var(--muted)}
.main{max-width:1100px;margin:0 auto;padding:1.25rem 1.5rem 5rem}
#drop-zone{
  border:1.5px dashed var(--border2);border-radius:10px;
  padding:2.5rem 1rem;text-align:center;cursor:pointer;
  transition:all 0.15s;margin-bottom:1.25rem;
}
#drop-zone:hover,#drop-zone.over{border-color:var(--green);background:rgba(168,240,74,0.03)}
#drop-zone .icon{font-size:2rem;opacity:0.3;margin-bottom:0.6rem}
#drop-zone .t{font-size:0.88rem;font-weight:600;margin-bottom:0.3rem}
#drop-zone .s{font-size:0.72rem;color:var(--muted);font-family:var(--mono)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:0.6rem;margin-bottom:1.25rem}
.sc{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:0.7rem 1rem}
.sc-n{font-size:1.5rem;font-weight:700;line-height:1;margin-bottom:0.2rem}
.sc-l{font-family:var(--mono);font-size:0.6rem;color:var(--muted)}
.c-ok{color:var(--green)}.c-comp{color:var(--amber)}.c-done{color:var(--blue)}.c-err{color:var(--red)}
.table-wrap{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.tbar{
  display:flex;align-items:center;gap:0.6rem;padding:0.65rem 1rem;
  border-bottom:1px solid var(--border);background:var(--s2);flex-wrap:wrap;
}
.tbar-title{font-family:var(--mono);font-size:0.68rem;color:var(--muted2);margin-right:auto}
.tbtn{
  background:none;border:1px solid var(--border2);border-radius:var(--r);
  color:var(--muted);font-family:var(--mono);font-size:0.62rem;
  padding:0.25rem 0.55rem;cursor:pointer;transition:all 0.12s;white-space:nowrap;
}
.tbtn:hover{color:var(--text);border-color:var(--text)}
.col-hd,.row{
  display:grid;
  grid-template-columns:20px 52px minmax(0,2fr) 96px 72px 130px 130px 76px;
  gap:0.5rem;align-items:center;padding:0.55rem 1rem;border-bottom:1px solid var(--border);
}
.col-hd{background:var(--s3);border-bottom:1px solid var(--border2);padding:0.38rem 1rem;}
.col-hd span{font-family:var(--mono);font-size:0.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em}
.row:last-child{border-bottom:none}
.row:hover{background:var(--s2)}
.row input[type=checkbox]{accent-color:var(--green);width:13px;height:13px;cursor:pointer}
.thumb{width:48px;height:36px;object-fit:contain;border-radius:4px;background:var(--s3);display:block}
.rname{font-family:var(--mono);font-size:0.68rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted2)}
.rmeta{font-family:var(--mono);font-size:0.68rem;color:var(--muted2)}
.badge{
  display:inline-flex;align-items:center;gap:3px;
  font-family:var(--mono);font-size:0.6rem;font-weight:500;
  padding:0.22rem 0.5rem;border-radius:4px;white-space:nowrap;
}
.b-loop{background:rgba(168,240,74,0.1);color:var(--green)}
.b-comp{background:rgba(255,184,48,0.1);color:var(--amber)}
.out-cell{font-family:var(--mono);font-size:0.62rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.out-kb{color:var(--muted2)}.out-kb.ok{color:var(--green)}.out-kb.warn{color:var(--red)}
.act-btn{
  background:none;border:1px solid var(--border2);border-radius:var(--r);
  color:var(--muted2);font-family:var(--mono);font-size:0.6rem;
  padding:0.28rem 0.5rem;cursor:pointer;transition:all 0.12s;white-space:nowrap;width:100%;
}
.act-btn:hover:not(:disabled){border-color:var(--green);color:var(--green)}
.act-btn.done{border-color:var(--green);color:var(--green);background:rgba(168,240,74,0.08)}
.act-btn.err{border-color:var(--red);color:var(--red)}
.act-btn:disabled{opacity:0.35;cursor:not-allowed}
.empty{padding:3.5rem;text-align:center;color:var(--muted);font-family:var(--mono);font-size:0.75rem}
.bbar{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(13,13,13,0.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);padding:0.7rem 1.5rem;
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
}
.sel-info{font-family:var(--mono);font-size:0.72rem;color:var(--muted);min-width:80px}
.b-main{
  background:var(--green);color:#0a0a0a;border:none;border-radius:var(--r);
  font-family:var(--sans);font-size:0.82rem;font-weight:700;
  padding:0.5rem 1.1rem;cursor:pointer;transition:opacity 0.12s;
}
.b-main:hover{opacity:0.88}
.b-main:disabled{opacity:0.3;cursor:not-allowed}
.b-sec{
  background:none;border:1px solid var(--border2);border-radius:var(--r);
  color:var(--muted2);font-family:var(--mono);font-size:0.72rem;
  padding:0.5rem 0.9rem;cursor:pointer;transition:all 0.12s;
}
.b-sec:hover{border-color:var(--text);color:var(--text)}
.prog-wrap{flex:1;min-width:140px;display:none}
.prog-track{background:var(--s3);border-radius:3px;height:4px;overflow:hidden}
.prog-bar{height:100%;background:var(--green);width:0;transition:width 0.2s}
.prog-label{font-family:var(--mono);font-size:0.62rem;color:var(--muted);margin-top:0.3rem}
#init-status{font-family:var(--mono);font-size:0.68rem;padding:0.5rem 1rem;color:var(--amber);display:none}
@media(max-width:800px){
  .col-hd,.row{grid-template-columns:20px 44px 1fr 80px 60px 110px 100px 64px}
  .summary{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>GIF 批次處理</h1>
  <span class="sub">Loop × 5 · 壓縮 &lt; 目標大小</span>
  <div class="topbar-right">
    <div class="sg">
      <label>Loop 次數</label>
      <input type="number" id="loop-count" value="5" min="0" max="65535">
      <span>次</span>
    </div>
    <div class="sg">
      <label>大小上限</label>
      <input type="number" id="max-kb" value="300" min="10" max="5000">
      <span>KB</span>
    </div>
  </div>
</div>

<div class="main">
  <div id="init-status">⏳ 正在載入 GIF 編碼器…</div>

  <div id="drop-zone" ondragover="onDragOver(event)" ondragleave="onDragLeave()" ondrop="onDrop(event)" onclick="document.getElementById('fi').click()">
    <div class="icon">🎞</div>
    <div class="t">點擊或拖曳 GIF 到這裡</div>
    <div class="s">可一次上傳多張 · 僅接受 .gif 格式</div>
    <input type="file" id="fi" multiple accept=".gif,image/gif" style="display:none" onchange="addFiles(this.files)">
  </div>

  <div class="summary">
    <div class="sc c-ok"><div class="sc-n" id="n-loop">0</div><div class="sc-l">🔁 只改 Loop</div></div>
    <div class="sc c-comp"><div class="sc-n" id="n-comp">0</div><div class="sc-l">📦 需壓縮</div></div>
    <div class="sc c-done"><div class="sc-n" id="n-done">0</div><div class="sc-l">✅ 已完成</div></div>
    <div class="sc c-err"><div class="sc-n" id="n-err">0</div><div class="sc-l">❌ 失敗</div></div>
  </div>

  <div class="table-wrap">
    <div class="tbar">
      <span class="tbar-title" id="tbar-count">尚未上傳 GIF</span>
      <button class="tbtn" onclick="selectAll()">全選</button>
      <button class="tbtn" onclick="clearAll()" style="color:var(--red)">清除全部</button>
    </div>
    <div class="col-hd">
      <span></span><span></span>
      <span>檔名</span><span>尺寸</span><span>原始大小</span>
      <span>處理方式</span><span>輸出結果</span><span>動作</span>
    </div>
    <div id="rows"><div class="empty">上傳 GIF 後顯示分析結果</div></div>
  </div>
</div>

<div class="bbar">
  <span class="sel-info" id="sel-info">已選 0 張</span>
  <button class="b-main" id="batch-btn" onclick="processBatch()" disabled>批量處理並下載 ZIP</button>
  <button class="b-sec" onclick="clearDone()">清除已完成</button>
  <div class="prog-wrap" id="prog-wrap">
    <div class="prog-track"><div class="prog-bar" id="prog-bar"></div></div>
    <div class="prog-label" id="prog-label"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// GIF DECODER (inline — no external CDN needed)
// ═══════════════════════════════════════════════════
function decodeGIF(buffer) {
  const d = new Uint8Array(buffer);
  let p = 6; // skip header "GIF89a"

  // Logical Screen Descriptor
  const W = d[p]|(d[p+1]<<8), H = d[p+2]|(d[p+3]<<8);
  const packed = d[p+4]; p += 7;
  const hasGCT = packed>>7, gctCount = 1<<((packed&7)+1);
  let gct = null;
  if (hasGCT) { gct = readCT(d, p, gctCount); p += gctCount*3; }

  const frames = [];
  let delay=100, disposal=0, transIdx=-1;

  while (p < d.length) {
    const b = d[p++];
    if (b === 0x3B) break; // trailer
    if (b === 0x21) {      // extension
      const label = d[p++];
      if (label === 0xF9) { // graphic control
        p++; // block size=4
        const fl = d[p++];
        delay = (d[p]|(d[p+1]<<8))*10; p+=2;
        transIdx = (fl&1) ? d[p] : -1; p++;
        disposal = (fl>>2)&7;
        p++; // terminator
      } else {
        skipBlocks(d, p); p = skipBlocksRet(d, p);
      }
    } else if (b === 0x2C) { // image
      const left=d[p]|(d[p+1]<<8), top=d[p+2]|(d[p+3]<<8);
      const iw=d[p+4]|(d[p+5]<<8), ih=d[p+6]|(d[p+7]<<8);
      const ipk=d[p+8]; p+=9;
      const hasLCT=ipk>>7, lctCount=1<<((ipk&7)+1), interlaced=(ipk>>6)&1;
      let ct = gct;
      if (hasLCT) { ct = readCT(d, p, lctCount); p += lctCount*3; }
      const minCode = d[p++];
      const compressed = readBlocks(d, p); p = skipBlocksRet(d, p);
      const pixels = lzwDecode(minCode, compressed);
      const patch = buildPatch(pixels, ct, transIdx, iw, ih, interlaced);
      frames.push({ dims:{left,top,width:iw,height:ih}, delay:delay||100, disposalType:disposal, patch });
      delay=100; disposal=0; transIdx=-1;
    }
  }
  return { lsd:{width:W,height:H}, frames };
}

function readCT(d, p, count) {
  const ct=[];
  for (let i=0;i<count;i++,p+=3) ct.push([d[p],d[p+1],d[p+2]]);
  return ct;
}
function readBlocks(d, p) {
  const out=[];
  while (true) { const s=d[p++]; if(!s)break; for(let i=0;i<s;i++) out.push(d[p++]); }
  return out;
}
function skipBlocksRet(d, p) {
  while (true) { const s=d[p++]; if(!s)break; p+=s; } return p;
}
function skipBlocks(d, p) { while(true){const s=d[p++];if(!s)break;p+=s;} }

function lzwDecode(minSize, data) {
  const clr=1<<minSize, eof=clr+1;
  let cs=minSize+1, mask=(1<<cs)-1, next=eof+1;
  const tbl=[];
  for(let i=0;i<clr;i++) tbl[i]=[i];
  tbl[clr]=[]; tbl[eof]=[];
  const out=[]; let bits=0,buf=0,di=0,prev=-1;
  while(di<data.length){
    while(bits<cs&&di<data.length){buf|=data[di++]<<bits;bits+=8;}
    const code=buf&mask; buf>>=cs; bits-=cs;
    if(code===clr){cs=minSize+1;mask=(1<<cs)-1;next=eof+1;prev=-1;for(let i=eof+1;i<4096;i++)tbl[i]=undefined;continue;}
    if(code===eof)break;
    let entry;
    if(code<next&&tbl[code]) entry=tbl[code];
    else if(code===next&&prev!==-1) entry=tbl[prev].concat(tbl[prev][0]);
    else break;
    for(const px of entry) out.push(px);
    if(prev!==-1&&next<4096){
      tbl[next]=tbl[prev].concat(entry[0]);
      next++;
      if(next>(mask)&&cs<12){cs++;mask=(1<<cs)-1;}
    }
    prev=code;
  }
  return out;
}

function buildPatch(pixels, ct, transIdx, w, h, interlaced) {
  const patch=new Uint8ClampedArray(w*h*4);
  const src = interlaced ? deinterlace(pixels,w,h) : pixels;
  for(let i=0;i<src.length&&i<w*h;i++){
    const ci=src[i];
    if(ci===transIdx){patch[i*4+3]=0;}
    else{const c=ct&&ct[ci]?ct[ci]:[0,0,0];patch[i*4]=c[0];patch[i*4+1]=c[1];patch[i*4+2]=c[2];patch[i*4+3]=255;}
  }
  return patch;
}

function deinterlace(pixels,w,h){
  const out=new Array(w*h); const starts=[0,4,2,1],steps=[8,8,4,2]; let row=0;
  for(let p=0;p<4;p++) for(let y=starts[p];y<h;y+=steps[p]){
    for(let x=0;x<w;x++) out[y*w+x]=pixels[row*w+x]; row++;
  }
  return out;
}

// ═══════════════════════════════════════════════════
// GIF BINARY LOOP PATCHER
// ═══════════════════════════════════════════════════
function patchLoopCount(buffer, count) {
  const d = new Uint8Array(buffer.slice(0));
  const sig=[0x4E,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2E,0x30];
  for(let i=0;i<d.length-19;i++){
    if(d[i]===0x21&&d[i+1]===0xFF&&d[i+2]===0x0B){
      if(sig.every((b,j)=>d[i+3+j]===b)&&d[i+14]===0x03&&d[i+15]===0x01){
        d[i+16]=count&0xFF; d[i+17]=(count>>8)&0xFF; return d.buffer;
      }
    }
  }
  return insertNetscape(d, count);
}

function insertNetscape(data, count) {
  const pk=data[10]; const hasGCT=pk>>7; const gctSz=hasGCT?3*(1<<((pk&7)+1)):0;
  const at=13+gctSz;
  const ns=new Uint8Array([0x21,0xFF,0x0B,0x4E,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2E,0x30,0x03,0x01,count&0xFF,(count>>8)&0xFF,0x00]);
  const res=new Uint8Array(data.length+ns.length);
  res.set(data.slice(0,at)); res.set(ns,at); res.set(data.slice(at),at+ns.length);
  return res.buffer;
}

// ═══════════════════════════════════════════════════
// GIF.JS WORKER — fetch once, blob it (avoids CORS issues)
// ═══════════════════════════════════════════════════
let workerBlobUrl = null;
async function getWorkerUrl() {
  if (workerBlobUrl) return workerBlobUrl;
  try {
    const r = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
    const txt = await r.text();
    const blob = new Blob([txt], {type:'application/javascript'});
    workerBlobUrl = URL.createObjectURL(blob);
    return workerBlobUrl;
  } catch(e) {
    return 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';
  }
}
// Pre-fetch worker on page load
getWorkerUrl().then(()=>{
  document.getElementById('init-status').style.display='none';
}).catch(()=>{});
document.getElementById('init-status').style.display='block';

// ═══════════════════════════════════════════════════
// APP STATE & HELPERS
// ═══════════════════════════════════════════════════
let items=[], nextId=0;
function getMaxKB(){ return parseFloat(document.getElementById('max-kb').value)||300; }
function getLoopCount(){ return parseInt(document.getElementById('loop-count').value)||5; }
function fmtKB(kb){ return kb>=1024?(kb/1024).toFixed(2)+' MB':kb.toFixed(0)+' KB'; }

function onDragOver(e){e.preventDefault();document.getElementById('drop-zone').classList.add('over');}
function onDragLeave(){document.getElementById('drop-zone').classList.remove('over');}
function onDrop(e){e.preventDefault();document.getElementById('drop-zone').classList.remove('over');addFiles(e.dataTransfer.files);}

function addFiles(fileList){
  const arr=Array.from(fileList).filter(f=>f.type==='image/gif'||f.name.toLowerCase().endsWith('.gif'));
  if(!arr.length)return;
  arr.forEach(f=>{
    const id=nextId++;
    const url=URL.createObjectURL(f);
    const kb=f.size/1024;
    items.push({id,file:f,name:f.name,kb,w:0,h:0,thumbUrl:url,
      needsCompress:kb>getMaxKB(),processState:'idle',blob:null,outKB:null,outW:null,outH:null,checked:true});
    // get dims
    const img=new Image();
    img.onload=()=>{const it=items.find(i=>i.id===id);if(it){it.w=img.naturalWidth;it.h=img.naturalHeight;render();}};
    img.src=url;
  });
  document.getElementById('fi').value='';
  render();
}

document.getElementById('max-kb').addEventListener('change',()=>{
  const m=getMaxKB();
  items.forEach(it=>it.needsCompress=it.kb>m);
  render();
});

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function render(){updateSummary();renderRows();updateBatchBar();}

function updateSummary(){
  document.getElementById('n-loop').textContent=items.filter(i=>!i.needsCompress).length;
  document.getElementById('n-comp').textContent=items.filter(i=>i.needsCompress).length;
  document.getElementById('n-done').textContent=items.filter(i=>i.processState==='done').length;
  document.getElementById('n-err').textContent=items.filter(i=>i.processState==='error'||i.processState==='over-limit').length;
  document.getElementById('tbar-count').textContent=items.length?`共 ${items.length} 個 GIF`:'尚未上傳 GIF';
}

function renderRows(){
  const c=document.getElementById('rows');
  if(!items.length){c.innerHTML='<div class="empty">上傳 GIF 後顯示分析結果</div>';return;}
  c.innerHTML=items.map(buildRow).join('');
}

function buildRow(it){
  const badge=it.needsCompress
    ?`<span class="badge b-comp">📦 壓縮 + Loop</span>`
    :`<span class="badge b-loop">🔁 只改 Loop</span>`;
  let outHtml='<span style="font-family:var(--mono);font-size:0.62rem;color:var(--muted)">—</span>';
  if(it.processState==='done'&&it.outKB!=null){
    const m=getMaxKB();
    const cls=it.outKB<=m?'ok':'warn';
    const icon=it.outKB<=m?'✓':'⚠';
    outHtml=`<div class="out-cell"><span class="out-kb ${cls}">${icon} ${fmtKB(it.outKB)}</span><span style="font-family:var(--mono);font-size:0.58rem;color:var(--muted)">${it.outW}×${it.outH}</span></div>`;
  } else if(it.processState==='processing'){
    outHtml=`<span style="font-family:var(--mono);font-size:0.62rem;color:var(--amber)">處理中…</span>`;
  }
  let actHtml;
  if(it.processState==='done') actHtml=`<button class="act-btn done" onclick="downloadOne(${it.id})">↓ 下載</button>`;
  else if(it.processState==='processing') actHtml=`<button class="act-btn" disabled>處理中…</button>`;
  else if(it.processState==='over-limit') actHtml=`<button class="act-btn err" onclick="processOne(${it.id})" title="壓縮後仍超限，無法加入ZIP，請用 ezgif.com 處理或回報 AM">❌ 超限，重試</button>`;
  else if(it.processState==='error') actHtml=`<button class="act-btn err" onclick="processOne(${it.id})">重試</button>`;
  else actHtml=`<button class="act-btn" onclick="processOne(${it.id})">處理</button>`;

  const rowStyle = it.processState==='over-limit' ? ' style="background:rgba(255,92,92,0.06);border-left:3px solid var(--red);"' : '';
  return `<div class="row" id="row-${it.id}"${rowStyle}>
    <div><input type="checkbox" ${it.checked?'checked':''} onchange="setCheck(${it.id},this.checked)"></div>
    <div><img class="thumb" src="${it.thumbUrl}" alt=""></div>
    <div class="rname" title="${it.name}">${it.name}</div>
    <div class="rmeta">${it.w?it.w+'×'+it.h:'—'}</div>
    <div class="rmeta">${fmtKB(it.kb)}</div>
    <div>${badge}</div>
    <div id="out-${it.id}">${outHtml}</div>
    <div id="act-${it.id}">${actHtml}</div>
  </div>`;
}

function updateRowCells(it){
  const m=getMaxKB();
  const actEl=document.getElementById('act-'+it.id);
  if(actEl){
    if(it.processState==='done') actEl.innerHTML=`<button class="act-btn done" onclick="downloadOne(${it.id})">↓ 下載</button>`;
    else if(it.processState==='processing') actEl.innerHTML=`<button class="act-btn" disabled>處理中…</button>`;
    else if(it.processState==='over-limit') actEl.innerHTML=`<button class="act-btn err" onclick="processOne(${it.id})" title="壓縮後仍超限，無法加入ZIP，請用 ezgif.com 處理或回報 AM">❌ 超限，重試</button>`;
    else if(it.processState==='error') actEl.innerHTML=`<button class="act-btn err" onclick="processOne(${it.id})">重試</button>`;
    else actEl.innerHTML=`<button class="act-btn" onclick="processOne(${it.id})">處理</button>`;
  }
  const outEl=document.getElementById('out-'+it.id);
  if(outEl){
    if(it.processState==='done'&&it.outKB!=null){
      const cls=it.outKB<=m?'ok':'warn';
      const icon=it.outKB<=m?'✓':'⚠';
      outEl.innerHTML=`<div class="out-cell"><span class="out-kb ${cls}">${icon} ${fmtKB(it.outKB)}</span><span style="font-family:var(--mono);font-size:0.58rem;color:var(--muted)">${it.outW}×${it.outH}</span></div>`;
    } else if(it.processState==='processing'){
      outEl.innerHTML=`<span style="font-family:var(--mono);font-size:0.62rem;color:var(--amber)">處理中…</span>`;
    } else {
      outEl.innerHTML=`<span style="font-family:var(--mono);font-size:0.62rem;color:var(--muted)">—</span>`;
    }
  }
  updateSummary();
}

function setCheck(id,val){const it=items.find(i=>i.id===id);if(it){it.checked=val;updateBatchBar();}}
function selectAll(){items.forEach(i=>i.checked=true);renderRows();updateBatchBar();}
function updateBatchBar(){
  const sel=items.filter(i=>i.checked);
  document.getElementById('sel-info').textContent=`已選 ${sel.length} 張`;
  document.getElementById('batch-btn').disabled=sel.length===0;
}
function clearAll(){items.forEach(i=>URL.revokeObjectURL(i.thumbUrl));items=[];render();}
function clearDone(){items=items.filter(i=>i.processState!=='done');render();}

// ═══════════════════════════════════════════════════
// CORE PROCESSING
// ═══════════════════════════════════════════════════
// ═══════════════════════════════════════════════════
// BINARY FRAME REDUCTION (no re-encoding, no quality loss)
// Removes frames directly from GIF binary — preserves delta encoding
// ═══════════════════════════════════════════════════
function parseGifStructure(buffer) {
  const data = new Uint8Array(buffer);
  let pos = 6; // skip "GIF89a" header
  // LSD
  const packed = data[10];
  const hasGCT = (packed >> 7) & 1;
  const gctSize = hasGCT ? 3 * (1 << ((packed & 7) + 1)) : 0;
  pos = 13 + gctSize;

  const frames = [];
  let pendingGCEPos = -1;
  let firstFramePos = -1;

  while (pos < data.length) {
    const b = data[pos];
    if (b === 0x3B) break; // Trailer
    if (b === 0x21) {
      const label = data[pos + 1];
      if (label === 0xF9) {
        // Graphic Control Extension (always 8 bytes)
        pendingGCEPos = pos;
        pos += 8;
      } else {
        // Other extension — skip sub-blocks
        pos += 2;
        while (data[pos]) { pos += data[pos] + 1; }
        pos += 1;
        pendingGCEPos = -1;
      }
    } else if (b === 0x2C) {
      const fStart = pendingGCEPos !== -1 ? pendingGCEPos : pos;
      if (firstFramePos === -1) firstFramePos = fStart;
      pos += 10; // Image descriptor
      const ipk = data[pos - 1];
      const hasLCT = (ipk >> 7) & 1;
      const lctSize = hasLCT ? 3 * (1 << ((ipk & 7) + 1)) : 0;
      pos += lctSize;
      pos++; // min LZW code size
      while (data[pos]) { pos += data[pos] + 1; }
      pos++; // block terminator
      frames.push({ start: fStart, end: pos });
      pendingGCEPos = -1;
    } else {
      break; // unexpected byte
    }
  }

  const preFrame = firstFramePos !== -1 ? data.slice(0, firstFramePos) : data.slice(0, pos);
  return { preFrame, frames, data };
}

function binaryFrameReduce(buffer, targetBytes) {
  const { preFrame, frames, data } = parseGifStructure(buffer);
  if (!frames.length) return null;
  if (data.length <= targetBytes) return null; // already small

  // Try progressively fewer frames until we hit target
  const ratios = [0.8, 0.6, 0.5, 0.4, 0.33, 0.25, 0.2, 0.15, 0.1];
  for (const ratio of ratios) {
    const keepCount = Math.max(1, Math.round(frames.length * ratio));
    const stride = Math.ceil(frames.length / keepCount);
    const kept = frames.filter((_, i) => i % stride === 0);
    const framesSize = kept.reduce((s, f) => s + (f.end - f.start), 0);
    const totalSize = preFrame.length + framesSize + 1;

    if (totalSize <= targetBytes) {
      const result = new Uint8Array(totalSize);
      result.set(preFrame, 0);
      let w = preFrame.length;
      for (const f of kept) {
        result.set(data.slice(f.start, f.end), w);
        w += f.end - f.start;
      }
      result[w] = 0x3B; // Trailer
      return result.buffer;
    }
  }
  return null; // couldn't reach target even with min frames
}

async function processGifItem(it){
  const maxKB=getMaxKB(), loopCount=getLoopCount();
  const buffer=await it.file.arrayBuffer();
  const maxBytes = maxKB * 1000;

  // Step 1: Apply loop count patch (always, fast binary op)
  const loopPatched = patchLoopCount(buffer, loopCount);

  // Step 2: If already under limit after loop patch, done
  if(loopPatched.byteLength < maxBytes){
    const blob=new Blob([loopPatched],{type:'image/gif'});
    return {blob,outW:it.w,outH:it.h,outKB:blob.size/1024};
  }

  // Step 3: Binary frame reduction
  // Removes frames directly from GIF binary — no re-encoding, no quality loss
  // Preserves delta frame encoding (unlike canvas approach which destroys it)
  const reduced = binaryFrameReduce(loopPatched, maxBytes);
  if(reduced){
    const blob=new Blob([reduced],{type:'image/gif'});
    return {blob,outW:it.w,outH:it.h,outKB:blob.size/1024};
  }

  // Step 4: Even keeping 10% of frames isn't small enough
  // Return loop-patched as best effort → processBatch marks as over-limit
  const blob=new Blob([loopPatched],{type:'image/gif'});
  return {blob,outW:it.w,outH:it.h,outKB:blob.size/1024};
}


async function processOne(id){
  const it=items.find(i=>i.id===id); if(!it)return;
  it.processState='processing'; updateRowCells(it);
  try{
    const r=await processGifItem(it);
    it.blob=r.blob; it.outKB=r.outKB; it.outW=r.outW; it.outH=r.outH;
    it.processState='done';
  }catch(e){ console.error(e); it.processState='error'; }
  updateRowCells(it); updateBatchBar();
}

function downloadOne(id){
  const it=items.find(i=>i.id===id); if(!it||!it.blob)return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(it.blob); a.download=it.name;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

async function processBatch(){
  const sel=items.filter(i=>i.checked&&i.processState!=='done'); if(!sel.length)return;
  const btn=document.getElementById('batch-btn'); btn.disabled=true;
  const pw=document.getElementById('prog-wrap'); pw.style.display='block';
  const pb=document.getElementById('prog-bar'), pl=document.getElementById('prog-label');
  const zip=new JSZip();

  for(let i=0;i<sel.length;i++){
    const it=sel[i];
    pb.style.width=Math.round(i/sel.length*100)+'%';
    pl.textContent=`${i+1}/${sel.length} — ${it.name}`;
    it.processState='processing'; updateRowCells(it);
    try{
      const r=await processGifItem(it);
      it.blob=r.blob; it.outKB=r.outKB; it.outW=r.outW; it.outH=r.outH;
      const _mk=getMaxKB();
      if(r.blob.size < _mk*1000){
        it.processState='done'; zip.file(it.name, r.blob);
      } else {
        it.processState='over-limit';
      }
    }catch(e){ console.error(e); it.processState='error'; }
    updateRowCells(it);
    await new Promise(r=>setTimeout(r,30));
  }

  pb.style.width='100%'; pl.textContent='打包中…';
  const content=await zip.generateAsync({type:'blob'});
  saveAs(content,`gif_processed_${new Date().toISOString().slice(0,10)}.zip`);
  pl.textContent=`完成！${sel.filter(i=>i.processState==='done').length} 個 GIF 已下載`;
  btn.disabled=false; updateBatchBar();
}
</script>
